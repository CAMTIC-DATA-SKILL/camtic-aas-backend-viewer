<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAMTIC AAS Viewer</title>
  <link rel="stylesheet" href="style.css?v=22">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/" class="back-link">← 플랫폼</a>
      <h1>CAMTIC AAS Viewer</h1>
    </div>
    <div class="topbar-actions">
      <button id="reload-btn" type="button">폴더 다시 읽기</button>
      <a href="/docs" target="_blank" rel="noopener">API 문서</a>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="panel packages">
      <h2>AASX 패키지</h2>
      <ul id="package-list" class="package-list"></ul>
    </aside>

    <main class="panel tree-panel">
      <section id="package-header" class="package-header"></section>
      <div class="tree-toolbar">
        <input id="search" type="search" placeholder="idShort, 값, semanticId 검색">
        <button id="expand-btn" type="button">모두 펼치기</button>
        <button id="collapse-btn" type="button">모두 접기</button>
        <button id="live-btn" type="button">현장 값 불러오기</button>
        <button id="live-view-btn" type="button" class="btn-primary">실시간 그래프</button>
        <button id="live-json-btn" type="button" class="btn-primary">실시간 JSON</button>
        <select id="download-format" aria-label="다운로드 형식" disabled>
          <option value="aasx">AASX</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
        </select>
        <button id="download-btn" type="button" disabled>파일 다운로드</button>
        <button id="upload-files-btn" type="button" disabled>파일 업로드</button>
        <span id="live-status" class="muted"></span>
      </div>
      <div id="tree" class="tree"></div>
    </main>

    <aside class="panel detail-panel" id="detail-panel">
      <div class="detail-head">
        <h2>상세 정보</h2>
      </div>
      <div id="detail" class="detail"><p class="muted">트리에서 항목을 선택하세요.</p></div>
      <section class="sim-host" id="sim-host">
        <div class="sim-toolbar">
          <span id="sim-mode" class="sim-badge">STOP</span>
          <button type="button" id="sim-live">LIVE</button>
          <button type="button" id="sim-demo">DEMO</button>
          <button type="button" id="sim-stop">STOP</button>
          <button type="button" id="sim-fit">맞춤</button>
        </div>
        <div class="sim-viewport" id="sim-viewport">
          <div id="sim-title" class="sim-title" hidden></div>
        </div>
        <details class="sim-drawer">
          <summary>캘리브레이션 · 매핑</summary>
          <div class="sim-drawer-body">
            <div class="sim-field-row">
              <label>구동 <select id="sim-drive"><option value="joint">Joint</option><option value="auto">자동</option><option value="tcp" selected>TCP IK</option></select></label>
              <label>TCP 단위 <select id="sim-pos-unit"><option value="mm" selected>mm</option><option value="m">m</option></select></label>
              <label>관절 단위 <select id="sim-joint-unit"><option value="deg" selected>deg</option><option value="rad">rad</option></select></label>
            </div>
            <div class="sim-map-grid" id="sim-map-grid">
              <label>X <span class="sim-bind" id="sim-bind-X"></span><select id="sim-map-X"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>Y <span class="sim-bind" id="sim-bind-Y"></span><select id="sim-map-Y"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>Z <span class="sim-bind" id="sim-bind-Z"></span><select id="sim-map-Z"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>Rx <span class="sim-bind" id="sim-bind-Rx"></span><select id="sim-map-Rx"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>Ry <span class="sim-bind" id="sim-bind-Ry"></span><select id="sim-map-Ry"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>Rz <span class="sim-bind" id="sim-bind-Rz"></span><select id="sim-map-Rz"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>J1 <span class="sim-bind" id="sim-bind-J1"></span><select id="sim-map-J1"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>J2 <span class="sim-bind" id="sim-bind-J2"></span><select id="sim-map-J2"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>J3 <span class="sim-bind" id="sim-bind-J3"></span><select id="sim-map-J3"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>J4 <span class="sim-bind" id="sim-bind-J4"></span><select id="sim-map-J4"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>J5 <span class="sim-bind" id="sim-bind-J5"></span><select id="sim-map-J5"><option value="auto">AAS 기본 바인딩</option></select></label>
              <label>J6 <span class="sim-bind" id="sim-bind-J6"></span><select id="sim-map-J6"><option value="auto">AAS 기본 바인딩</option></select></label>
            </div>
            <div class="sim-corr" id="sim-corr">
              <label>J1 <select id="sim-sign-0"><option value="1">+1</option><option value="-1">-1</option></select><input id="sim-zero-0" type="number" step="0.1" value="0" title="제로 보정(도)"></label>
              <label>J2 <select id="sim-sign-1"><option value="1">+1</option><option value="-1">-1</option></select><input id="sim-zero-1" type="number" step="0.1" value="0" title="제로 보정(도)"></label>
              <label>J3 <select id="sim-sign-2"><option value="1">+1</option><option value="-1">-1</option></select><input id="sim-zero-2" type="number" step="0.1" value="0" title="제로 보정(도)"></label>
              <label>J4 <select id="sim-sign-3"><option value="1">+1</option><option value="-1">-1</option></select><input id="sim-zero-3" type="number" step="0.1" value="0" title="제로 보정(도)"></label>
              <label>J5 <select id="sim-sign-4"><option value="1">+1</option><option value="-1">-1</option></select><input id="sim-zero-4" type="number" step="0.1" value="0" title="제로 보정(도)"></label>
              <label>J6 <select id="sim-sign-5"><option value="1">+1</option><option value="-1">-1</option></select><input id="sim-zero-5" type="number" step="0.1" value="0" title="제로 보정(도)"></label>
            </div>
          </div>
        </details>
      </section>
    </aside>

    <section class="panel live-dash" id="live-dash" hidden>
      <div class="live-head">
        <div class="live-title">
          <h2>실시간 그래프</h2>
          <span id="live-badge" class="status-badge">offline</span>
          <span id="live-ts" class="muted"></span>
        </div>
        <div class="live-controls">
          <select id="live-window">
            <option value="60">최근 60초</option>
            <option value="600">최근 10분</option>
            <option value="1800">최근 30분</option>
            <option value="3600">최근 1시간</option>
          </select>
        </div>
      </div>
      <div class="live-charts">
        <div class="live-chart-panel">
          <h3>Joint Position / Velocity <span class="muted">실선 Position · 점선 Velocity</span></h3>
          <div class="ctrl" id="joint-sel"></div>
          <div class="chart-box"><canvas id="chart-joint"></canvas></div>
        </div>
        <div class="live-chart-panel">
          <h3>Cartesian Position / Orientation</h3>
          <div class="ctrl" id="cart-sel"></div>
          <div class="chart-box"><canvas id="chart-cart"></canvas></div>
        </div>
      </div>
    </section>
  </div>

  <dialog id="live-json-dialog" class="live-json-dialog">
    <header>
      <div class="live-title">
        <h2>실시간 데이터 JSON</h2>
        <span id="live-json-badge" class="status-badge">offline</span>
        <span id="live-json-ts" class="muted"></span>
      </div>
      <div class="live-json-actions">
        <button id="live-json-copy" type="button">복사</button>
        <button id="live-json-close" type="button" class="icon-btn" aria-label="닫기">×</button>
      </div>
    </header>
    <pre id="live-json" class="live-json">waiting...</pre>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="documentation.js?v=4"></script>
  <script src="live.js?v=8"></script>
  <script src="app.js?v=14"></script>
  <script type="module" src="sim.js?v=11"></script>
</body>
</html>
